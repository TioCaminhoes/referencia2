{% extends 'base.html' %}{% block content %}<section class="page-title"><span class="eyebrow">SUPORTE</span><h1>Fale conosco</h1><p>Envie sua dúvida, sugestão ou reporte uma oferta.</p></section><form class="form-card" method="post">{% csrf_token %}<label>Nome<input name="name" required></label><label>E-mail<input type="email" name="email" required></label><label>Assunto<input name="subject" required></label><label>Mensagem<textarea name="message" rows="7" required></textarea></label><button class="btn primary">Enviar mensagem</button></form>{% endblock %}
