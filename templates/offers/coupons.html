{% extends 'base.html' %}{% block content %}<section class="page-title"><span class="eyebrow">CUPONS</span><h1>Cupons de desconto</h1><p>Copie o código e confira as regras na loja antes de comprar.</p></section><div class="coupon-grid">{% for c in coupons %}<div class="coupon-large"><span>{{c.store.name}}</span><h2>{{c.discount}}</h2><p>{{c.text}}</p><div><code>{{c.code}}</code><button onclick="copyCoupon('{{c.code}}')">Copiar cupom</button></div></div>{% endfor %}</div>{% endblock %}
